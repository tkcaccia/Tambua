name: CPU tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
      - name: Install fastPLS 0.4 numerical libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential gfortran pkg-config libopenblas-dev liblapack-dev
      - name: Install pinned fastPLS 0.4 from GitHub
        run: |
          Rscript -e 'install.packages(c("remotes", "float", "gpuinfo"), repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github("tkcaccia/fastPLS@265108b6aa250c2534f98ec89037bb5cd001dca0", upgrade="never", dependencies=FALSE)'
          Rscript -e 'stopifnot(as.character(packageVersion("fastPLS")) == "0.4")'
      - name: Install package and CPU test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[datasets]' pytest
      - name: Run Tambua tests
        run: python -m pytest -q
