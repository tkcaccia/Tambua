[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tambua-cell-types"
version = "0.1.0"
description = "Research cell-type classification from CellPhenotyper GigaTIME virtual-marker scores and fastPLS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
datasets = ["pyarrow>=18", "Pillow>=11", "tifffile==2025.5.10", "zarr==2.18.7", "imagecodecs>=2025.3.30,<2027"]

[project.scripts]
tambua = "tambua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tambua = ["*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]

