[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tambua-cell-types"
version = "0.1.0"
description = "Research cell-type classification from CellPhenotyper GigaTIME virtual-marker scores and fastPLS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.23", "fastPLS @ git+https://github.com/tkcaccia/fastPLS-py.git@b4ea261902244bfb84ad933a236d364d19f905ee"]

[project.scripts]
tambua = "tambua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

